<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Positif</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#0b1220;
color:white;
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
}

.box{
background:rgba(255,255,255,0.06);
padding:18px;
border-radius:14px;
width:240px;
text-align:center;
}

input,button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
box-sizing:border-box;
}

button{
background:#22c55e;
font-weight:bold;
cursor:pointer;
}

/* APP */
#app{display:none;}

header{
padding:15px;
text-align:center;
font-weight:bold;
background:linear-gradient(135deg,#22c55e,#0ea5e9);
}

/* NAV */
nav{
display:flex;
justify-content:space-around;
background:#0f172a;
padding:10px;
border-top:1px solid rgba(255,255,255,0.08);
gap:6px;
}

nav button{
flex:1;
padding:10px 0;
border:none;
border-radius:14px;
background:rgba(255,255,255,0.05);
color:#aaa;
font-weight:bold;
transition:0.2s;
}

nav button.active{
background:#22c55e;
color:black;
box-shadow:0 0 12px rgba(34,197,94,0.35);
}

/* SECTION */
.section{display:none;padding:15px;}
.section.active{display:block;}

/* CHECKLIST */
.card{
background:rgba(255,255,255,0.06);
padding:10px;
margin:6px 0;
border-radius:10px;
display:flex;
justify-content:space-between;
}

.tap{
cursor:pointer;
font-size:18px;
}

.tap.done{
color:#22c55e;
cursor:not-allowed;
}

/* BATTERY */
.battery-wrap{margin-top:10px;}

.battery{
width:100%;
height:18px;
border:2px solid #aaa;
border-radius:6px;
overflow:hidden;
}

.battery-fill{
height:100%;
width:0%;
background:#22c55e;
transition:0.3s;
}

.battery-text{
margin-top:5px;
font-size:12px;
text-align:center;
color:#aaa;
}

/* RECAP */
.recap{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:12px;
text-align:center;
}

.history{
background:rgba(255,255,255,0.06);
padding:10px;
margin:8px 0;
border-radius:10px;
}

/* CALENDAR */
.month-title{
margin-top:18px;
font-weight:bold;
color:#22c55e;
}

.weekdays{
display:grid;
grid-template-columns:repeat(7,1fr);
text-align:center;
font-size:11px;
color:#aaa;
margin-top:5px;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
margin-top:5px;
}

.day{
padding:8px;
text-align:center;
background:rgba(255,255,255,0.05);
border-radius:6px;
font-size:12px;
}

.today{
background:#22c55e;
color:black;
font-weight:bold;
}

/* MUSIC BUTTON (hidden default) */
#musicBtn{
position:fixed;
bottom:80px;
right:15px;
width:55px;
height:55px;
border-radius:50%;
border:none;
background:#22c55e;
color:black;
font-size:20px;
box-shadow:0 0 10px rgba(34,197,94,0.4);
display:none;
}

.month-title{
  font-weight:bold;
  margin:10px 0;
}

/* JANUARI */
.month-0 .bulan { color:#ef4444; }

/* FEBRUARI */
.month-1 .bulan { color:#f97316; }

/* MARET */
.month-2 .bulan { color:#eab308; }

/* APRIL */
.month-3 .bulan { color:#22c55e; }

/* MEI */
.month-4 .bulan { color:#FF0000; }

/* JUNI */
.month-5 .bulan { color:#FFFF00; }

/* JULI */
.month-6 .bulan { color:#ADFF2F; }

/* AGUSTUS */
.month-7 .bulan { color:#00BFFF; }

/* SEPTEMBER */
.month-8 .bulan { color:#FF00FF; }

/* OKTOBER */
.month-9 .bulan { color:#f43f5e; }

/* NOVEMBER */
.month-10 .bulan { color:	#FFA500; }

/* DESEMBER */
.month-11 .bulan { color:#00FFFF; }

.month-title .tahun{
  color:#00FF00;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h2>Habit Positif 🌿</h2>
<input id="pw" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- APP -->
<div id="app">

<header>Habit Positif 🌿</header>

<nav>
<button onclick="tab('cal')" class="active">Kalender</button>
<button onclick="tab('check')">Checklist</button>
<button onclick="tab('rec')">Hari Ini</button>
<button onclick="tab('his')">History</button>
</nav>

<!-- KALENDER -->
<div id="cal" class="section active">
<div id="calendar"></div>
</div>

<!-- CHECKLIST -->
<div id="check" class="section">

<div class="card">07.15 Olahraga Pagi <span class="tap">☐</span></div>
<div class="card">08.10 Minum Asupan <span class="tap">☐</span></div>
<div class="card">13.00 Makan Siang <span class="tap">☐</span></div>
<div class="card">15.15 Olahraga Sore <span class="tap">☐</span></div>
<div class="card">Tidak PMO <span class="tap">☐</span></div>

<div class="battery-wrap">
<div class="battery">
<div class="battery-fill" id="batteryFill"></div>
</div>
<div class="battery-text" id="percentText">0%</div>
</div>

</div>

<!-- RECAP -->
<div id="rec" class="section">
<div class="recap">
<div id="todayDate"></div>
<h2 id="todayPercent"></h2>
<div id="doneList"></div>
</div>
</div>

<!-- HISTORY -->
<div id="his" class="section">
<div id="historyBox"></div>
</div>

</div>

<!-- MUSIC BUTTON (HIDDEN BEFORE LOGIN) -->
<button id="musicBtn" onclick="cycleMusic()">🎵</button>

<audio id="bgMusic"></audio>

<script>

let todayKey = new Date().toDateString();
let data = JSON.parse(localStorage.getItem("habit") || "{}");

/* LOGIN */
function login(){
if(document.getElementById("pw").value==="1269"){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("musicBtn").style.display="block"; // 🔥 FIX

calendar();
init();
load();
}
}

/* NAV */
function tab(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

document.querySelectorAll("nav button").forEach(b=>{
b.classList.remove("active");
});
event.target.classList.add("active");
}

/* CHECKLIST */
function init(){
document.querySelectorAll(".tap").forEach((t,i)=>{
t.onclick=()=>{
if(t.classList.contains("done")) return;
t.classList.add("done");
t.innerText="☑";
save(i);
}
});
}

/* SAVE */
function save(index){
if(!data[todayKey]) data[todayKey]=Array(5).fill(false);
data[todayKey][index]=true;
localStorage.setItem("habit",JSON.stringify(data));
load();
}

/* LOAD */
function load(){
let today = data[todayKey] || Array(5).fill(false);

document.querySelectorAll(".tap").forEach((t,i)=>{
if(today[i]){
t.classList.add("done");
t.innerText="☑";
}
});

let done = today.filter(v=>v).length;
let percent = Math.round((done/5)*100);

document.getElementById("batteryFill").style.width = percent + "%";
document.getElementById("percentText").innerText = percent + "%";

document.getElementById("todayDate").innerText =
"📅 " + new Date().toLocaleDateString();

document.getElementById("todayPercent").innerText = percent + "%";

let list = [
"Olahraga Pagi",
"Minum Asupan",
"Makan Siang",
"Olahraga Sore",
"Tidak PMO"
];

document.getElementById("doneList").innerHTML =
list.map((l,i)=>
`<div>${l} : ${today[i] ? "☑" : "☐"}</div>`
).join("");

renderHistory();
}

function renderHistory(){

let box = document.getElementById("historyBox");

if(!box) return;

box.innerHTML="";

let keys = Object.keys(data).reverse();

let bulanSekarang = "";

keys.forEach(key=>{

let today = data[key];

let done = today.filter(v=>v).length;

let percent = Math.round((done/5)*100);

let list = [
"Olahraga Pagi",
"Minum Asupan",
"Makan Siang",
"Olahraga Sore",
"Tidak PMO"
];

let selesai = list
.filter((item,i)=>today[i])
.map(item=>"☑ " + item)
.join("<br>");

if(!selesai) selesai = "Belum ada checklist";

let tanggal = new Date(key);

let namaBulan = tanggal.toLocaleDateString("id-ID",{
month:"long",
year:"numeric"
}).toUpperCase();

let indo = tanggal.toLocaleDateString("id-ID",{
weekday:"long",
day:"2-digit",
month:"short",
year:"numeric"
}).replace(",","");

if(namaBulan !== bulanSekarang){

bulanSekarang = namaBulan;

box.innerHTML += `
<div style="
background:rgba(34,197,94,0.15);
border:1px solid rgba(34,197,94,0.3);
padding:12px;
border-radius:12px;
margin-top:15px;
margin-bottom:8px;
font-weight:bold;
color:#22c55e;
text-align:center;
font-size:18px;
">
📅 ${namaBulan}
</div>
`;
}

box.innerHTML += `
<div class="history">
<b>📅 ${indo} — ${percent}%</b>
<br><br>
${selesai}
</div>
`;

});

}

/* CALENDAR */
function calendar(){
let el=document.getElementById("calendar");
let now=new Date();
let html="";

for(let m=4;m<=11;m++){

let days=new Date(2026,m+1,0).getDate();
let first=new Date(2026,m,1).getDay();
if(first===0) first=7;

let namaBulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

html += `<div class="month-title month-${m}">
  <span class="bulan">${namaBulan[m]}</span>
  <span class="tahun">2026</span>
</div>`;

html+=`<div class="weekdays">
<div>Sen</div><div>Sel</div><div>Rab</div>
<div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div>
</div>`;

html+=`<div class="calendar">`;

for(let i=1;i<first;i++) html+=`<div></div>`;

for(let d=1; d<=days; d++){
let isToday =
(d===now.getDate() &&
m===now.getMonth() &&
now.getFullYear()===2026);

html+=`<div class="day ${isToday?"today":""}">${d}</div>`;
}

html+=`</div>`;
}
el.innerHTML=html;
}

/* MUSIC CYCLE */
let musicIndex = 0;
let musicPlaying = false;

let musicList = [
"music1.mp3",
"music2.mp3",
"music3.mp3",
"music4.mp3",
"music5.mp3"
];

function cycleMusic(){

let music = document.getElementById("bgMusic");
let btn = document.getElementById("musicBtn");

if(!musicPlaying){
musicIndex = 0;
music.src = musicList[musicIndex];
music.play();
musicPlaying = true;
btn.innerText = "🎶1";
return;
}

musicIndex++;

if(musicIndex < musicList.length){
music.src = musicList[musicIndex];
music.play();
btn.innerText = "🎶" + (musicIndex + 1);
}else{
music.pause();
music.currentTime = 0;
musicPlaying = false;
musicIndex = 0;
btn.innerText = "🎵";
}
}

</script>

</body>
</html>
